name: azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Render
        run: python site/render.py --out _site --base /
      - name: Serve 404.html for unknown paths
        run: |
          printf '%s\n' '{"responseOverrides": {"404": {"rewrite": "/404.html"}}}' > _site/staticwebapp.config.json
      - uses: Azure/static-web-apps-deploy@v1
        id: swa
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: _site
          skip_app_build: true
          skip_api_build: true
      - name: Three URLs answer 200
        env:
          BASE: https://witty-glacier-0ac9f4910.8.azurestaticapps.net/
        run: |
          set -e
          for p in "" "today/" "status.json"; do
            code=$(curl -s -o /tmp/page -w '%{http_code}' "$BASE$p")
            echo "$BASE$p -> $code"; [ "$code" = "200" ]
          done
          curl -s "$BASE" | grep -q "Here is the evidence, both ways"
