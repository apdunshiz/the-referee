name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/configure-pages@v5
        id: pages
      - name: Render
        run: python site/render.py --out _site --base "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Three URLs answer 200 and the Today page has no raw tags from content
        env:
          BASE: ${{ needs.deploy.outputs.page_url || 'https://apdunshiz.github.io/the-referee/' }}
        run: |
          set -e
          for p in "" "today/" "status.json"; do
            code=$(curl -s -o /tmp/page -w '%{http_code}' "$BASE$p")
            echo "$BASE$p -> $code"; [ "$code" = "200" ]
          done
          curl -s "$BASE" | grep -q "where every argument stands"
          ! curl -s "${BASE}today/" | grep -q "<script>alert"
